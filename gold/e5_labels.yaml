# E5 builder file (blueprint 10.4): the 50 canonical questions and the gold-goal label of every
# one of the 120 cells. Merged into gold/intents_test.jsonl by
#     python -m finagent.evaluation.e5_gold label
# which refuses to change any of Vineet's questions (each must equal its imported text) and is
# refused once the set is frozen.
#
# Provenance (limitation): written by the builder (the coding assistant, which also wrote the
# intent training templates) on 2026-11-25, after training. The labels come from the blueprint's
# goal definitions (8.15, 13, Appendix D; decisions #120, #135) and the grid cell only. No model
# (M0, M1) and no planner component was run on these questions before the labels were written.
# The canonical questions follow the Appendix D wording; Vineet's 70 questions are the blind part.
#
# Label conventions:
# - goals: one goal per company and named figure; a comparison gives one goal per company with
#   the same kind, metric and period. Fields left out take the Goal defaults: metric "" (no
#   figure named: the kind's default set), scenario "", target null, conditional false.
# - period: the fiscal year the question names (a bare year is the filer's fiscal year; every
#   bare year below is for a calendar-year filer), else "latest" ("latest", "most recent", or no
#   year). Forecast, liquidity and debt goals: "latest" (they project from the latest 10-K).
# - target: the projected fiscal year named; null when none is named or the question asks for the
#   first projected year.
# - scenario: forecast, liquidity and debt only; the named scenario, Base when none is named
#   (#120 a).
# - conditional: the debt goal of "liquidity, and debt service only if there is a shortfall"; it
#   takes the liquidity goal's scenario and target.
# - clarification: the grid cell's category (expected CLARIFICATION, no goals).
# - end_to_end: true for every question with goals, except the past_target and beyond_horizon
#   traps, whose expected answer is a gap with no value to compare; false for clarifications.
# - notes: typos kept as written, and the reading chosen where a question is ambiguous.

