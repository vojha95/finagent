# Excel workbook layout (blueprint 8.9; Phase 4d; BC21). General rules only: never a ticker
# (CLAUDE.md rule 3).
#
# reported_rows: the reported detail block (block A) of each statement sheet, in display order.
#   Each entry is a metric of the validated statement set (canonical item, A.2 model input or
#   derivation). A row is shown when the filer has any observation of the metric other than
#   NOT_REPORTED in some year; a metric the filer never reports is left out (not a GAP row).
#   REPORTED_FACT values are blue inputs; CALCULATION values (derivations) are live formulas
#   built from the derivation's own terms. A metric listed on a second sheet ("link: true") is
#   a formula linking to its first appearance.
#   label overrides the concept-map / model-input label (derivations have none).
# schedule_inputs: model-input facts shown only on the Forecast sheet (maturity tables, origin
#   year only).
# days_in_year for projected DSO / DIO / DPO comes from configs/scenarios.yaml.

number_formats:
  dollars: '#,##0.0,,;(#,##0.0,,);"–"'     # full dollars stored, $ millions shown
  ratio: '0.00"x";-0.00"x"'
  percent: '0.0%;-0.0%'
  days: '0.0'
  rate: '0.00%'

reported_rows:
  Income Statement:
    - {metric: revenue}
    - {metric: cost_of_revenue}
    - {metric: gross_profit, label: Gross profit}
    - {metric: research_and_development}
    - {metric: selling_general_and_administrative}
    - {metric: operating_expenses}
    - {metric: total_costs_and_expenses}
    - {metric: operating_expense_after_cost_of_sales, label: Operating expense after cost of sales}
    - {metric: operating_income}
    - {metric: ebit_proxy, label: EBIT proxy (pre-tax + interest)}
    - {metric: interest_expense}
    - {metric: interest_expense_gross}
    - {metric: interest_and_debt_expense}
    - {metric: interest_expense_debt}
    - {metric: interest_income_expense_net}
    - {metric: net_interest_expense, label: Net interest expense}
    - {metric: nonoperating_net, label: Non-operating items, net}
    - {metric: pretax_income}
    - {metric: pretax_income_before_equity_method}
    - {metric: income_tax_expense}
    - {metric: equity_method_income}
    - {metric: discontinued_operations}
    - {metric: below_tax_net, label: Items below tax, net}
    - {metric: net_income_including_nci}
    - {metric: nci_net_income}
    - {metric: net_income}
    - {metric: depreciation_and_amortisation}
    - {metric: depreciation}
    - {metric: operating_lease_cost}
  Balance Sheet:
    - {metric: cash_and_cash_equivalents}
    - {metric: short_term_investments}
    - {metric: accounts_receivable}
    - {metric: total_receivables}
    - {metric: inventory}
    - {metric: total_current_assets}
    - {metric: ppe_net}
    - {metric: operating_lease_rou_asset}
    - {metric: total_assets}
    - {metric: accounts_payable}
    - {metric: short_term_borrowings}
    - {metric: commercial_paper}
    - {metric: long_term_debt_current}
    - {metric: operating_lease_liability_current}
    - {metric: finance_lease_liability_current}
    - {metric: total_current_liabilities}
    - {metric: long_term_debt}
    - {metric: operating_lease_liability_noncurrent}
    - {metric: finance_lease_liability_noncurrent}
    - {metric: other_noncurrent_liabilities}
    - {metric: total_liabilities}
    - {metric: funded_debt, label: Funded debt}
    - {metric: operating_lease_liability}
    - {metric: finance_lease_liability}
    - {metric: temporary_equity}
    - {metric: retained_earnings}
    - {metric: retained_earnings_opening}
    - {metric: equity_attributable_to_parent}
    - {metric: noncontrolling_interest_equity}
    - {metric: total_equity}
    - {metric: total_liabilities_and_equity}
  Cash Flow:
    - {metric: net_income, link: true}
    - {metric: net_income_including_nci, link: true}
    - {metric: depreciation_and_amortisation, link: true}
    - {metric: depreciation, link: true}
    - {metric: operating_cash_flow}
    - {metric: capital_expenditure}
    - {metric: capex_oil_and_gas}
    - {metric: capex_other_productive_assets}
    - {metric: investing_cash_flow}
    - {metric: dividends_paid}
    - {metric: repurchases_paid}
    - {metric: dividends_charged_to_re}
    - {metric: repurchases_charged_to_re}
    - {metric: financing_cash_flow}
    - {metric: fx_effect_on_cash}
    - {metric: net_change_in_cash}
    - {metric: statement_cash_opening}
    - {metric: statement_cash}
    - {metric: free_cash_flow, label: Free cash flow (CFO - capex)}

schedule_inputs:
  - debt_principal_y1
  - debt_principal_y2
  - debt_principal_y3
  - operating_lease_payments_y1
  - operating_lease_payments_y2
  - operating_lease_payments_y3
  - finance_lease_payments_y1
  - finance_lease_payments_y2
  - finance_lease_payments_y3
