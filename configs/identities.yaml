# Identity library I1-I12 (blueprint Appendix B), evaluated per filing on that filing's own
# readings. Phase 4a reports results only; failures go to the Correlation Agent in Phase 5.
#
# Status: PASS | FAIL | NOT_COMPUTABLE (with the missing operands listed).
# Tolerance: exact (I11: the residual must be exactly zero); default: the larger of rounding at
# the reported scale (half a displayed unit per operand) and 0.1% of the largest operand; or
# rounded_components (I9, I10; BC24): exact zero when every operand is a single reported total,
# else half the reporting unit x the number of rounded presented components summed into the
# operands (e.g. a face-block total liabilities of 7 rows: 3.5 at a $1M unit).
#
# An optional term with on_face counts only when its fact is shown as its own face-statement row
# (display_check MATCH); otherwise it is left out and listed "(not a face row)".
#
# Terms are "+id" / "-id" over canonical items, model inputs, derivations, bases
# (derivations.yaml) and the operands below. Optional terms the filer does not present are left
# out and listed (never stored as 0); a presented but unaccepted optional term makes the identity
# NOT_COMPUTABLE.
#
# Identity kinds:
#   sum          the signed terms must sum to zero; with variants, each variant is tried in turn
#                and the identity passes if a computable variant passes (the variant is recorded);
#                a variant may be {terms, requires_presented}: computed only when those metrics
#                are presented by a channel, never derived
#   cf_top_row   the first row of the cash flow statement read as one of `items` must equal the
#                income statement's reading of one of them (I6); an item listed in
#                items_when_no_nci is compared only when the filing is known to report no NCI
#   ordering     sum(lower) <= middle <= upper, presented lower terms only (I7)
#   prior_year   each face item: filing t's prior-year column vs filing t-1 (I8), both channels
#   sanity       sign and size checks, one result per check (I12)

operands:
  # Equity in I2 and I9: total equity, or parent equity when the filing reports no NCI
  # (BC13 rule: no non-dimensional MinorityInterest fact, or only nil or zero), or parent + NCI.
  equity:
    first_of:
      - terms: ["+total_equity"]
      - terms: ["+equity_attributable_to_parent"]
        when_no_nci: {concepts: [us-gaap:MinorityInterest], period: instant}
      - terms: ["+equity_attributable_to_parent", "+noncontrolling_interest_equity"]
  # Net income including NCI for I5.
  net_income_consolidated:
    first_of:
      - terms: ["+net_income_including_nci"]
      - terms: ["+net_income"]
        when_no_nci:
          concepts: [us-gaap:NetIncomeLossAttributableToNoncontrollingInterest]
          period: duration
      - terms: ["+net_income", "+nci_net_income"]
  receivables:
    first_of:
      - terms: ["+accounts_receivable"]
      - terms: ["+total_receivables"]
  depreciation_basis:
    first_of:
      - terms: ["+depreciation"]
      - terms: ["+depreciation_and_amortisation"]

identities:
  - id: I1
    label: Total assets = total liabilities and equity
    kind: sum
    terms: ["+total_assets", "-total_liabilities_and_equity"]
    tolerance: default

  - id: I2
    label: Total liabilities + equity (+ temporary equity) = total liabilities and equity
    kind: sum
    terms: ["+total_liabilities", "+equity", "-total_liabilities_and_equity"]
    optional:
      - term: "+temporary_equity"
        on_face: true  # a parenthetical "includes redeemable NCI of ..." is inside equity already
    tolerance: default

  - id: I3
    label: Gross profit = revenue - cost of revenue (GP presented)
    kind: sum
    requires_presented: [gross_profit]
    terms: ["+gross_profit", "-revenue", "+cost_of_revenue"]
    tolerance: default

  - id: I4
    label: Operating income = revenue - total costs and expenses, or GP - operating expenses
    kind: sum
    variants:
      - ["+operating_income", "-revenue", "+total_costs_and_expenses"]
      # Only with a gross profit line on the face, never a derived GP (#74, decided by Vineet):
      # a filer without one may total its operating expenses including cost of revenue.
      - terms: ["+operating_income", "-gross_profit", "+operating_expenses"]
        requires_presented: [gross_profit]
    tolerance: default

  - id: I5
    label: Net income = pre-tax - tax +/- equity-method and discontinued items
    kind: sum
    terms: ["+net_income_consolidated", "-pretax_basis", "+income_tax_expense"]
    optional:
      # Only a pre-tax line before equity-method income leaves equity-method income below tax.
      - term: "-equity_method_income"
        when_basis: {pretax_basis: pretax_income_before_equity_method}
      - term: "-discontinued_operations"
    tolerance: default

  - id: I6
    label: Net income at the top of the cash flow statement = income statement net income
    kind: cf_top_row
    statement: CF
    items: [net_income, net_income_including_nci]
    # #114, #148 (BC26): the cash flow starts from consolidated net income, so parent net income
    # is compared only when NCI is known to be absent (BC13 from the tags; BC23 without them).
    # Otherwise only net income including NCI is compared (NOT_COMPUTABLE if it is not read),
    # and I6 alone can never move a parent reading to the consolidated row.
    items_when_no_nci:
      net_income:
        concepts: [us-gaap:NetIncomeLossAttributableToNoncontrollingInterest]
        period: duration
    tolerance: default

  - id: I7
    label: Cash + securities + receivables + inventory <= current assets <= total assets
    kind: ordering
    lower: [cash_and_cash_equivalents, short_term_investments, receivables, inventory]
    middle: total_current_assets
    upper: total_assets
    tolerance: default

  - id: I8
    label: Prior-year column in filing t = current-year column in filing t-1
    kind: prior_year
    tolerance: default

  - id: I9
    label: Assets - (liabilities + equity) = 0
    kind: sum
    terms: ["+total_assets", "-total_liabilities", "-equity"]
    optional:
      - term: "-temporary_equity"
        on_face: true
    tolerance: rounded_components

  - id: I10
    label: Opening statement cash + CFO + CFI + CFF + FX - closing statement cash = 0
    kind: sum
    terms: ["+statement_cash_opening", "+operating_cash_flow", "+investing_cash_flow",
            "+financing_cash_flow", "-statement_cash"]
    optional:
      - term: "+fx_effect_on_cash"
    tolerance: rounded_components

  - id: I11
    label: Opening RE + net income - disclosed distributions charged to RE - closing RE = 0
    kind: sum
    terms: ["+retained_earnings_opening", "+net_income", "-retained_earnings"]
    # Appendix B "when: distributions disclosed" (#61, decided): computed only when the filing
    # discloses dividends or repurchases charged to RE (RE-member facts); otherwise
    # NOT_COMPUTABLE. A disclosed kind the filer does not report is left out and listed. Other RE
    # charges (adoption adjustments, preferred dividends, ...) are not modelled, so a failure is
    # REVIEW with its residual: reported, never a blocker for the forecast or for acceptance.
    requires_any: [dividends_charged_to_re, repurchases_charged_to_re]
    optional:
      - term: "-dividends_charged_to_re"
      - term: "-repurchases_charged_to_re"
    tolerance: exact
    on_failure: REVIEW

  - id: I12
    label: "Sanity: revenue > 0; capex >= 0; depreciation >= 0; capex < revenue"
    kind: sanity
    checks:
      - {rule: positive, terms: [revenue]}
      - {rule: non_negative, terms: [capital_expenditure]}
      - {rule: non_negative, terms: [depreciation_basis]}
      - {rule: less_than, terms: [capital_expenditure, revenue]}
    tolerance: exact
