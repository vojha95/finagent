# Company universe and splits (blueprint 9.2). Tickers resolve to CIKs through the pinned
# company_tickers.json; nothing in the package branches on a ticker (CLAUDE.md rule 3).
#
# train: fit models. validation: model selection, error analysis, demo (Amazon and Microsoft
# stay here for continuity with the prototype). held_out: scored once per model version,
# never opened for debugging.

train:
  - AAPL   # Apple
  - GOOGL  # Alphabet
  - META   # Meta Platforms
  - NVDA   # NVIDIA
  - ORCL   # Oracle
  - CSCO   # Cisco
  - ADBE   # Adobe
  - CRM    # Salesforce
  - INTC   # Intel
  - QCOM   # Qualcomm
  - IBM    # IBM
  - WMT    # Walmart
  - TGT    # Target
  - HD     # Home Depot
  - LOW    # Lowe's
  - MCD    # McDonald's
  - SBUX   # Starbucks
  - KO     # Coca-Cola
  - PEP    # PepsiCo
  - PG     # Procter & Gamble
  - CAT    # Caterpillar
  - DE     # Deere
  - HON    # Honeywell
  - LMT    # Lockheed Martin
  - UPS    # UPS
  - EOG    # EOG Resources (replaced ExxonMobil: XOM moved to a new holding-company registration with no 10-K yet, 2026)
  - COP    # ConocoPhillips
  - JNJ    # Johnson & Johnson
  - PFE    # Pfizer
  - VZ     # Verizon
  - CMCSA  # Comcast
  - UNP    # Union Pacific

validation:
  - AMZN   # Amazon
  - MSFT   # Microsoft
  - CVX    # Chevron
  - NKE    # Nike
  - MRK    # Merck
  - T      # AT&T
  - CL     # Colgate-Palmolive
  - ABT    # Abbott

held_out:
  - COST   # Costco
  - NFLX   # Netflix
  - TXN    # Texas Instruments
  - GIS    # General Mills
  - FDX    # FedEx
  - LLY    # Eli Lilly
  - DHR    # Danaher
  - MAR    # Marriott

# Issuer names a question may use (blueprint 8.15 issuer resolution; Phase 6). Ticker -> names.
# Matched case-insensitively, with or without a possessive ('s). Tickers themselves match only
# when written in capitals. CIKs and the SEC registrant title come from the pinned
# company_tickers.json, never from here. Held-out names are listed so a question naming one is
# recognised; the planner then reads no data for it (9.2).
names:
  AAPL: [Apple, Apple Inc]
  GOOGL: [Alphabet, Google]
  META: [Meta Platforms, Meta, Facebook]
  NVDA: [NVIDIA]
  ORCL: [Oracle]
  CSCO: [Cisco, Cisco Systems]
  ADBE: [Adobe]
  CRM: [Salesforce]
  INTC: [Intel]
  QCOM: [Qualcomm]
  IBM: [IBM, International Business Machines]
  WMT: [Walmart, Wal-Mart]
  TGT: [Target, Target Corporation]
  HD: [Home Depot]
  LOW: [Lowe's, Lowes]
  MCD: [McDonald's, McDonalds]
  SBUX: [Starbucks]
  KO: [Coca-Cola, Coca Cola, Coke]
  PEP: [PepsiCo, Pepsi]
  PG: [Procter & Gamble, Procter and Gamble, P&G]
  CAT: [Caterpillar]
  DE: [Deere, John Deere, Deere & Company]
  HON: [Honeywell]
  LMT: [Lockheed Martin, Lockheed]
  UPS: [United Parcel Service, UPS]
  EOG: [EOG Resources, EOG]
  COP: [ConocoPhillips, Conoco]
  JNJ: [Johnson & Johnson, Johnson and Johnson, J&J]
  PFE: [Pfizer]
  VZ: [Verizon]
