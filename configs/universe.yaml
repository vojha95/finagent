# Names that are also ordinary words in questions ("target year", "an oracle"): matched only as
# written here (capitalised) or in full capitals.
capitalised_names: [Apple, Oracle, Meta, Adobe, Intel, Target, Caterpillar, Chevron, UPS, Coke]
