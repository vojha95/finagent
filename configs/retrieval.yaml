# Evidence retrieval (blueprint 8.14; Phase 7.2). Read by finagent.config.load_retrieval_config.
# General rules only: never a ticker (CLAUDE.md rule 3). Developed on the dev filings (AMZN,
# MSFT; D10) before any run on the six test companies.

sections:
  # Form 10-K Items in their order. A body heading must follow this order (the longest ordered
  # run of headings is kept, earliest first); a heading out of order is ignored.
  items: ["1", "1A", "1B", "1C", "2", "3", "4", "5", "6", "7", "7A", "8", "9", "9A", "9B", "9C",
          "10", "11", "12", "13", "14", "15", "16"]
  # Items reported per filing as found / not found (retrieval-0001).
  expected: ["1", "1A", "7", "7A", "8"]
  # An Item heading: a short text block outside tables, or a one-row table, that starts with
  # "Item <id>" followed by punctuation and a title, or by punctuation alone ("Item 7."). A bare
  # "Item 7" with no punctuation is a running page header, not a heading.
  item_pattern: '^item\s+(\d{1,2}[a-c]?)\s*(?:[.:—–-]\s*(\S.*)?|\s*[.:])$'
  heading_max_chars: 200
  # Table of contents: a table holding at least this many Item headings, or a run of at least
  # this many consecutive headings each followed by fewer than toc_max_words alphabetic words.
  toc_min_items: 3
  toc_max_words: 10
  # Item 8 note headings, numbered from 1 in sequence (a number out of sequence is ignored):
  # "Note 6 — Debt" style (any case), or "6. Debt" style (a capitalised short title, no final
  # full stop).
  # Inside a numbered title, a token of chunks.abbreviations ("Co.", "Inc.", "U.S.") does not
  # count as a full stop (#172, retrieval-0002).
  note_patterns:
    - '(?i)^note\s+(\d{1,2})\s*[.:—–-]\s*(\S.*)$'
    - '^(\d{1,2})\s*[.—–-]\s+([A-Z][^.]*)$'
  note_max_words: 15
  # A bare note number ("NOTE 1", "1.") whose title is the next text block (a short title of at
  # most note_max_words words, starting with a letter, no final full stop). Found on train
  # filings (#172, retrieval-0002). A lone number is never a page number here (furniture).
  note_bare_pattern: '(?i)^(?:note\s+)?(\d{1,2})\s*[.:]?$'

  # Pointer Items (#171, retrieval-0002; developed on train filings). An Item listed here whose
  # text, up to the next Item heading, has fewer than pointer_max_words alphabetic words only
  # refers to another part of the document. Its content is the span that starts at the first
  # anchor heading after the pointer and, when `confirm` lists patterns, holds a heading
  # matching one of them before the next Item heading. A heading here is a text block of at
  # most anchor_max_words words, not an Item heading, with no final full stop (a list entry
  # such as "Consolidated Balance Sheet (page 44)." is not one); patterns are matched at its
  # start with spaces removed, lower case and plain apostrophes, because some filers split
  # words in headings ("CONSOLIDATED B ALANCE SHEETS"). The span ends at the next Item heading
  # or the next relocated span. The content takes the Item's id (ITEM_8, with its notes) and
  # the pointer becomes ITEM_8/POINTER. Without an anchor the pointer stays and is reported
  # (e.g. statements incorporated by reference, BC10).
  pointer_max_words: 100
  anchor_max_words: 20
  relocation:
    "7":
      anchors: ["^(management's)?discussionandanalysis"]
    "8":
      anchors: ['^reportofindependentregisteredpublicaccountingfirm',
                '^(consolidated)?statements?of(consolidated)?(income|operations|earnings)',
                '^consolidatedbalancesheets?',
                '^notesto(the)?consolidatedfinancialstatements']
      confirm: ['^consolidatedbalancesheets?',
                '^notesto(the)?consolidatedfinancialstatements']

blocks:
  # Leaf text blocks (no nested block or table) outside tables.
  tags: [p, div, li, h1, h2, h3, h4, h5, h6]
  # Page furniture dropped from the text flow (whole-block match, case-insensitive).
  furniture: ['^(page\s*)?\d{1,3}$', '^table of contents$', '^index to financial statements$']
  # A table with a cell like these is a data table (stored separately); a table with none is
  # layout (bullets, footnotes) and joins the text flow.
  numeric_cell: '^[($\-—–]*\s*\$?\s*\(?\d[\d,]*(\.\d+)?\)?\s*%?\)?$'

chunks:
  target_words: 150  # about 200 tokens (8.14)
  max_words: 250
  # Tokens ending in a full stop that do not end a sentence (lower case, with the stop).
  abbreviations: [inc., corp., co., ltd., llc., no., nos., u.s., u.k., e.g., i.e., vs., etc.,
                  approx., mr., ms., mrs., dr., st., jan., feb., mar., apr., jun., jul., aug.,
                  sep., sept., oct., nov., dec., fig., sec., art., p.m., a.m.]

bm25:
  k1: 1.5
  b: 0.75
  top_k: 20
  stopwords: [a, an, and, are, as, at, be, by, for, from, has, have, in, is, it, its, of, on,
              or, that, the, this, to, was, were, which, with, we, our, us]

# Retrieval variants (blueprint 8.14; Phase 7.4; D8). Every variant ranks the same text chunks of
# one 10-K, as of a date, in the allowed sections; the quote rules (finagent.retrieval.quotes,
# 7.3) are the same for all. bm25 stays the default until E3 (7.6) decides (Vineet); the other
# variants load the pinned local models (configs/models.yaml), offline only.
#   bm25               BM25 (above)
#   dense              bge-small-en-v1.5 embeddings, cosine similarity (unit vectors, NumPy)
#   hybrid_rrf         reciprocal rank fusion of the BM25 and dense rankings: score =
#                      sum 1 / (rrf_k + rank), over each ranking of the section's chunks
#                      (BM25: chunks with a positive score); the best top_k are kept
#   hybrid_rrf_rerank  the hybrid_rrf top_k re-scored by the cross-encoder (query, chunk); the
#                      best `keep` are kept (8.14: keep top 3; a quote has at most two sentences)
# Embeddings are cached on disk per model hash and chunk sha256 (finagent.retrieval.dense).
search:
  default_variant: bm25
  dense:
    model: embedder  # configs/models.yaml
    # bge-small-en-v1.5 model card: the instruction for short queries that retrieve passages.
    query_instruction: "Represent this sentence for searching relevant passages: "
    batch_size: 32
    cache_dir: derived/embeddings  # git-ignored
  fusion:
    rrf_k: 60
    top_k: 20
  rerank:
    model: reranker  # configs/models.yaml
    keep: 3
