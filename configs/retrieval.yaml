# Evidence retrieval (blueprint 8.14; Phase 7.2). Read by finagent.config.load_retrieval_config.
# General rules only: never a ticker (CLAUDE.md rule 3). Developed on the dev filings (AMZN,
# MSFT; D10) before any run on the six test companies.

sections:
  # Form 10-K Items in their order. A body heading must follow this order (the longest ordered
  # run of headings is kept, earliest first); a heading out of order is ignored.
  items: ["1", "1A", "1B", "1C", "2", "3", "4", "5", "6", "7", "7A", "8", "9", "9A", "9B", "9C",
          "10", "11", "12", "13", "14", "15", "16"]
  # Items reported per filing as found / not found (retrieval-0001).
  expected: ["1", "1A", "7", "7A", "8"]
  # An Item heading: a short text block outside tables, or a one-row table, that starts with
  # "Item <id>" followed by punctuation and a title, or by punctuation alone ("Item 7."). A bare
  # "Item 7" with no punctuation is a running page header, not a heading.
  item_pattern: '^item\s+(\d{1,2}[a-c]?)\s*(?:[.:—–-]\s*(\S.*)?|\s*[.:])$'
  heading_max_chars: 200
  # Table of contents: a table holding at least this many Item headings, or a run of at least
  # this many consecutive headings each followed by fewer than toc_max_words alphabetic words.
  toc_min_items: 3
  toc_max_words: 10
  # Item 8 note headings, numbered from 1 in sequence (a number out of sequence is ignored):
  # "Note 6 — Debt" style (any case), or "6. Debt" style (a capitalised short title, no final
  # full stop).
  note_patterns:
    - '(?i)^note\s+(\d{1,2})\s*[.:—–-]\s*(\S.*)$'
    - '^(\d{1,2})\s*[.—–-]\s+([A-Z][^.]*)$'
  note_max_words: 15

blocks:
  # Leaf text blocks (no nested block or table) outside tables.
  tags: [p, div, li, h1, h2, h3, h4, h5, h6]
  # Page furniture dropped from the text flow (whole-block match, case-insensitive).
  furniture: ['^(page\s*)?\d{1,3}$', '^table of contents$', '^index to financial statements$']
  # A table with a cell like these is a data table (stored separately); a table with none is
  # layout (bullets, footnotes) and joins the text flow.
  numeric_cell: '^[($\-—–]*\s*\$?\s*\(?\d[\d,]*(\.\d+)?\)?\s*%?\)?$'

chunks:
  target_words: 150  # about 200 tokens (8.14)
  max_words: 250
  # Tokens ending in a full stop that do not end a sentence (lower case, with the stop).
  abbreviations: [inc., corp., co., ltd., llc., no., nos., u.s., u.k., e.g., i.e., vs., etc.,
                  approx., mr., ms., mrs., dr., st., jan., feb., mar., apr., jun., jul., aug.,
                  sep., sept., oct., nov., dec., fig., sec., art., p.m., a.m.]

bm25:
  k1: 1.5
  b: 0.75
  top_k: 20
  stopwords: [a, an, and, are, as, at, be, by, for, from, has, have, in, is, it, its, of, on,
              or, that, the, this, to, was, were, which, with, we, our, us]
