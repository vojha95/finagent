# Training-data templates for the intent classifier (blueprint 8.15 step 3; Phase 6). Read by
# finagent.planner.intent_data, which fills the slots from configs/intents.yaml and
# configs/universe.yaml (train-split issuers only) with a fixed seed. No LLM and no external
# service writes or rewrites any of this; the paraphrase families were written by hand (by the
# coding assistant, a limitation recorded in docs/planner_v1.md).
#
# E5 QUESTION AUTHORS: DO NOT READ THIS FILE before writing your questions
# (docs/e5_question_brief.md). The E5 set stays blind only if its author has not seen these.
#
# Each family is one template; the train / validation split is by family (validation_share of
# each intent's families), so no validation phrasing is seen in training.
# Slots: {issuer} {issuer2} a train-split issuer name or ticker; {metric} {metric2} a phrase of
# the intent's metric table (verb phrases excluded); {year} a fiscal year; {target} a projected
# fiscal year or a relative phrase ("next year"); {scenario} a named scenario phrase; {latest} a
# latest-period phrase. metrics: [...] fixes the expected metric of a family with no {metric}.
# style: template (close to the canonical form) or paraphrase (natural wording). split: train or
# validation pins the split of a family added after a dataset version was built (#245): pinned
# families are drawn after all others, so the earlier families keep their split and samples.

seed: 20261125
samples_per_family: 13
validation_share: 0.2
verb_phrases: [sell, sold, earn, earned]
ticker_share: 0.2

families:
  fact:
    - {id: fact_01, style: template, text: "What was {issuer}'s {metric} in {year}?"}
    - {id: fact_02, style: template, text: "What was the {metric} of {issuer} for {year}?"}
    - {id: fact_03, style: template, text: "Show {issuer} {metric} for {year}"}
    - {id: fact_04, style: template, text: "Give me the {latest} {metric} for {issuer}"}
    - {id: fact_05, style: template, text: "{issuer} {metric} {year}"}
    - {id: fact_06, style: template, text: "What did {issuer} report as {metric} in {year}?"}
    - {id: fact_07, style: template, text: "Compare {issuer} and {issuer2} {metric} in {year}"}
    - {id: fact_08, style: template, text: "{issuer} vs {issuer2}: {latest} {metric}"}
    - {id: fact_09, style: template, text: "What were {issuer}'s {metric} and {metric2} in {year}?"}
    - {id: fact_10, style: paraphrase, text: "How much did {issuer} sell in {year}?", metrics: [revenue]}
    - {id: fact_11, style: paraphrase, text: "How much did {issuer} earn {latest}?", metrics: [net_income]}
    - {id: fact_12, style: paraphrase, text: "Pull the reported {metric} figure from {issuer}'s {year} 10-K"}
    - {id: fact_13, style: paraphrase, text: "I need {issuer}'s {metric} for fiscal {year}, please"}
    - {id: fact_14, style: paraphrase, text: "Can you tell me how much {metric} {issuer} had at the end of {year}?"}
    - {id: fact_15, style: paraphrase, text: "Which was larger in {year}, {issuer}'s or {issuer2}'s {metric}?"}
    - {id: fact_16, style: paraphrase, text: "Look up {metric} in {issuer}'s annual report for {year}"}
    - {id: fact_17, style: paraphrase, text: "What number did {issuer} put down for {metric} {latest}?"}
    - {id: fact_18, style: paraphrase, text: "Remind me what {issuer}'s {metric} came in at in {year}"}
    - {id: fact_19, style: paraphrase, text: "Quick one: {issuer}'s {metric}, {year}?"}
    - {id: fact_20, style: paraphrase, text: "What figure for {metric} appears in {issuer}'s {year} filing?"}
