# Investigation planner (blueprint 8.15; Phase 6). Read by finagent.config.load_planner_config.
# General rules only: never a ticker (CLAUDE.md rule 3).

# Goal kinds (8.15 registry, Appendix D) and the slots each takes.
#   metrics: required (the question must name one), optional (none = the kind's defaults, the
#            goal metric is ""), none (the kind has no metric slot)
#   scenario / target: the kind takes a scenario of configs/scenarios.yaml and a projected year;
#            its period is then always the origin ("latest") and a year in the clause is the target
#   conditional: the kind may be conditional (on a liquidity shortfall)
goal_kinds:
  fact: {metrics: required}
  statements: {metrics: none}
  forecast: {metrics: optional, scenario: true, target: true,
             defaults: [revenue, free_cash_flow, cash]}
  credit: {metrics: optional, defaults: [current_ratio, quick_ratio, ebit_to_gross_interest]}
  liquidity: {metrics: optional, scenario: true, target: true,
              defaults: [liquidity_headroom, liquidity_shortfall]}
  debt: {metrics: none, scenario: true, target: true, conditional: true}
  explain: {metrics: required}
  risk: {metrics: none}

# A forecast, liquidity or debt goal with no scenario named (reviewer decision, #120).
default_scenario: Base

# A comparison covers two issuers (8.15 step 1).
max_issuers: 2

# The trained goal compiler (8.15 step 3) and its fallback (step 4). A clause whose top intent
# probability is below the threshold goes to the regex grammar, then to CLARIFICATION. There is
# no LLM fallback in Phase 6 (blueprint 15: optional, Phase 8; #120).
compiler:
  model_version: v2  # models/intent_v2.joblib (v1 data with the #132 artefacts tidied)
  # Chosen on the validation families of datasets/intents_v2.parquet by
  # python -m finagent.training.intent --version v2: the lowest threshold whose accepted
  # validation clauses reach target_precision (models/intent_v2.meta.json). Target precision
  # 0.98 kept by reviewer decision #130 (fixed before any E5 run).
  confidence_threshold: 0.875
  target_precision: 0.98

# Action registry (blueprint 8.15; BC25). An action runs for a goal of `kind` whose status is
# `trigger` ("start", or the reason code a tool returned with MISSING_PRIMARY), once its
# `prerequisite` goal (same issuer and period) is VERIFIED; the lowest priority runs first.
# explain_movement and risk_signals are Phase 7 placeholders: they return GAP
# NOT_YET_AVAILABLE, never a value (debt_service_scoped is built, 7.1).
actions:
  - {name: reported_verified, kind: fact, trigger: start, priority: 0}
  - {name: reported_tag_only, kind: fact, trigger: DOC_MISSING, priority: 1}
  - {name: reported_document_only, kind: fact, trigger: TAG_MISSING, priority: 1}
  - {name: reconcile, kind: statements, trigger: start, priority: 2}
  - {name: project, kind: forecast, trigger: start, prerequisite: statements, priority: 3}
  - {name: credit_ratios, kind: credit, trigger: start, prerequisite: statements, priority: 3}
  - {name: liquidity, kind: liquidity, trigger: start, prerequisite: statements, priority: 3}
  - {name: debt_service_scoped, kind: debt, trigger: start, prerequisite: statements,
     priority: 4}
  - {name: explain_movement, kind: explain, trigger: start, prerequisite: fact, priority: 4}
  - {name: risk_signals, kind: risk, trigger: start, prerequisite: statements, priority: 4}

# Tool calls per investigation (8.15: 12, configurable 0-30). Reused calls are not counted.
step_budget: {default: 12, min: 0, max: 30}

# What the observation gate accepts, per goal kind and metric (8.16; reviewer decision #118):
# the unit and the classifications. by_metric overrides the kind's entry. Fact metrics with a
# derivation in configs/derivations.yaml are a CALCULATION (always, or when the filer presents
# no line: unless_presented). Statements residuals: I9 and I10 required, I11 when computable.
answers:
  fact:
    unit: USD
    classification: [REPORTED_FACT]
    by_metric:
      free_cash_flow: {classification: [CALCULATION]}
      funded_debt: {classification: [CALCULATION]}
      gross_profit: {classification: [REPORTED_FACT, CALCULATION]}
      net_income: {classification: [REPORTED_FACT, CALCULATION]}
      total_liabilities: {classification: [REPORTED_FACT, CALCULATION]}
  statements:
    unit: USD
    classification: [CALCULATION]
    metrics: [I9, I10, I11]
    required: [I9, I10]
  forecast: {unit: USD, classification: [CALCULATION_FROM_MODEL_ASSUMPTION]}
  credit:
    unit: x
    classification: [CALCULATION]
    by_metric:
      dso: {unit: days}
      dio: {unit: days}
      dpo: {unit: days}
      cash_conversion_cycle: {unit: days}
      revenue_growth: {unit: percent}
      gross_margin: {unit: percent}
      ebit_margin: {unit: percent}
      net_margin: {unit: percent}
      capex_to_revenue: {unit: percent}
      fcf_margin: {unit: percent}
  liquidity: {unit: USD, classification: [CALCULATION_FROM_MODEL_ASSUMPTION]}
  # Scoped debt service (8.12; #155): a debt goal takes no metric, so the gate checks this list
  # (as for statements). comprehensive_dscr is always a gap (withheld with its reasons).
  debt:
    unit: USD
    classification: [CALCULATION_FROM_MODEL_ASSUMPTION]
    metrics: [scoped_dscr, cfo_less_capex, debt_service, scheduled_principal, funded_interest,
              finance_lease_payments, comprehensive_dscr]
    required: [scoped_dscr]
    by_metric:
      scoped_dscr: {unit: x}
      comprehensive_dscr: {unit: x}
  explain: {unit: USD, classification: [REPORTED_FACT]}  # Phase 7
  risk: {unit: "", classification: [CALCULATION]}  # Phase 7
