# finagent.config.load_model_pins; used by finagent.retrieval.models.
#
# Each model is pinned by its Hugging Face commit (revision) and by the sha256 and size of every
# file it needs (the safetensors weights, configs and tokenizer; not the onnx, openvino or
# pytorch_model.bin copies). Downloaded once (2026-11-25) with
# `python -m finagent.retrieval.models download`, into `root` (git-ignored, never evidence/),
# then loaded offline only (HF_HUB_OFFLINE=1, local_files_only). `verify` fails when a file is
# missing or its size or sha256 differs. The model.safetensors hashes equal the LFS sha256
# published by the hub for that revision. The D9 NLI judge (E4) was added in 7.6 the same way
# (downloaded 2026-11-25; evaluation only, never used by the product).

